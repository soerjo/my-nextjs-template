name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Policy: dependency vulnerabilities are reported as warnings and do NOT
      # fail the build. `bun audit` exits non-zero when advisories are found,
      # so `continue-on-error: true` keeps CI green when a downstream advisory
      # lands (e.g. between dependency bumps). Review the step output/logs and
      # address findings out-of-band; it is intentionally not a required check.
      - name: Security audit (non-blocking — advisories are warnings)
        run: bun audit
        continue-on-error: true

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_APP_NAME: "My App"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          NEXT_PUBLIC_API_URL: ""

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: my-nextjs-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
